<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Rapor Madrasah</title>
<style>
:root{--g:#123b32;--g2:#23634f;--bg:#f3f7f4;--line:#dce7df;--ink:#192d26}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,Arial;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:var(--g);color:white;padding:18px}.brand{font-weight:800;font-size:19px;margin-bottom:22px}.brand small{display:block;font-size:12px;font-weight:400;color:#c7ded2}.nav button{display:block;width:100%;text-align:left;border:0;background:none;color:#e0eee6;padding:11px;border-radius:9px;margin:4px 0}.nav .active,.nav button:hover{background:#ffffff22}.top{background:white;border-bottom:1px solid var(--line);padding:16px 24px}.top h1{margin:0;font-size:21px}.top p{margin:3px 0;color:#718078;font-size:13px}.content{padding:22px;max-width:1300px;margin:auto}.hero{background:linear-gradient(110deg,#123b32,#28715a);color:white;padding:22px;border-radius:16px}.hero h2{margin:0 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.panel,.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:16px}.stat small{color:#718078}.stat strong{display:block;font-size:26px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 12px}.head h2{margin:0;font-size:18px}.btn{background:white;border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin:2px;color:var(--ink);font-weight:650}.primary{background:var(--g2);border-color:var(--g2);color:white}.danger{color:#a3342c}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea,.search{padding:10px;border:1px solid #cbd9d0;border-radius:8px;background:white;width:100%}.field textarea{min-height:70px}.form{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e7eee9}th{background:#f6faf7;font-size:12px}tr:last-child td{border:0}.muted,small{color:#718078}.notice{background:#fff5dc;border:1px solid #f0dfb7;padding:11px;border-radius:9px;font-size:13px;margin:12px 0}.badge{background:#e7f4eb;color:#21614e;border-radius:20px;padding:4px 8px;font-size:12px}.warn{background:#fff0d2;color:#805f1c}.report{background:white;padding:22px;border:1px solid var(--line);border-radius:10px}.report h2,.report h3{text-align:center}.report table{min-width:0}.report th,.report td{border:1px solid #aaa;padding:6px}.sign{display:flex;justify-content:space-between;text-align:center;margin-top:45px}.modalback{position:fixed;inset:0;background:#102a22aa;display:grid;place-items:center;padding:12px;z-index:5}.modal{background:white;padding:20px;border-radius:14px;width:min(620px,100%);max-height:90vh;overflow:auto}.actions{display:flex;flex-wrap:wrap;gap:5px}.toast{position:fixed;bottom:15px;right:15px;background:var(--g);color:white;padding:12px;border-radius:9px;z-index:9}@media(max-width:760px){.app{grid-template-columns:1fr}.side{padding:9px}.brand{margin:4px}.nav{display:flex;overflow:auto;gap:3px}.nav button{white-space:nowrap;width:auto;padding:9px}.content{padding:12px}.top{padding:13px}.form{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}}@media print{.side,.top,.no-print,.toast{display:none!important}.app{display:block}.content{padding:0}.report{border:0}@page{size:A4;margin:14mm}}
</style>
<div class="app"><aside class="side"><div class="brand">✦ E-Rapor Madrasah<small>Kurikulum Merdeka · Web</small></div><nav class="nav" id="nav"><button class="active" data-p="home">⌂ Beranda</button><button data-p="students">♙ Data Siswa</button><button data-p="subjects">▤ Mata Pelajaran</button><button data-p="grades">✓ Input Nilai</button><button data-p="reports">▧ Rapor</button><button data-p="settings">⚙ Pengaturan & Cadangan</button></nav></aside><main><header class="top"><h1 id="title">Beranda</h1><p id="sub">Data tersimpan lokal di browser</p></header><div class="content" id="content"></div></main></div><div id="overlay"></div>
<script>
const KEY='erapor_web_v1',DEF={settings:{school:'Nama Madrasah',teacher:'Nama Wali Kelas',address:'',year:'2026/2027',semester:'Ganjil',wd:40,wu:30,wa:30},students:[],subjects:[{id:'1',name:'Al-Qur’an Hadis',cat:'Agama',kkm:75},{id:'2',name:'Akidah Akhlak',cat:'Agama',kkm:75},{id:'3',name:'Fikih',cat:'Agama',kkm:75},{id:'4',name:'Bahasa Arab',cat:'Agama',kkm:75},{id:'5',name:'Bahasa Indonesia',cat:'Umum',kkm:75},{id:'6',name:'Matematika',cat:'Umum',kkm:75},{id:'7',name:'Muatan Lokal',cat:'Muatan Lokal',kkm:75}],grades:[]};
let db;try{let x=JSON.parse(localStorage.getItem(KEY));db=x?Object.assign(structuredClone(DEF),x,{settings:Object.assign({},DEF.settings,x.settings)}):structuredClone(DEF)}catch(e){db=structuredClone(DEF)}let page='home';
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),S=i=>db.students.find(x=>x.id===i),M=i=>db.subjects.find(x=>x.id===i),G=(s,m)=>db.grades.find(x=>x.sid===s&&x.mid===m),v=i=>($(i)?.value||'').trim(),avg=g=>{let s=db.settings,t=Number(s.wd)+Number(s.wu)+Number(s.wa)||100;return (Number(g.daily)*s.wd+Number(g.uts)*s.wu+Number(g.uas)*s.wa)/t},fmt=n=>Number(n).toLocaleString('id-ID',{maximumFractionDigits:1}),btn=(t,a,c='')=>'<button class="btn '+c+'" data-a="'+a+'">'+t+'</button>',field=(l,n,x='',type='text')=>'<div class="field"><label>'+l+'</label><input id="'+n+'" type="'+type+'" value="'+esc(x)+'"></div>',sel=(l,n,opts,x)=>'<div class="field"><label>'+l+'</label><select id="'+n+'">'+opts.map(o=>'<option value="'+esc(o[0])+'" '+(o[0]===x?'selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></div>',ratings=['Sangat Baik','Baik','Cukup','Perlu Bimbingan'].map(x=>[x,x]);
function toast(t){let z=document.createElement('div');z.className='toast';z.textContent=t;document.body.append(z);setTimeout(()=>z.remove(),2300)}function go(p){page=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));render()}$('nav').onclick=e=>{let b=e.target.closest('[data-p]');if(b)go(b.dataset.p)};
function render(){let names={home:'Beranda',students:'Data Siswa',subjects:'Mata Pelajaran',grades:'Input Nilai',reports:'Rapor Siswa',settings:'Pengaturan & Cadangan'};$('title').textContent=names[page];$('sub').textContent=db.settings.school+' · '+db.settings.year+' · Semester '+db.settings.semester;$('content').innerHTML=({home:home,students:students,subjects:subjects,grades:grades,reports:reports,settings:settings})[page]()}
function home(){return '<section class="hero"><h2>Assalamu’alaikum, Bapak/Ibu Guru 👋</h2><p>Catat nilai, kehadiran, sikap, dan cetak rapor dengan mudah.</p>'+btn('+ Tambah Siswa','addstu','primary')+btn('Input Nilai','gograde')+'</section><div class="stats"><div class="stat"><small>Jumlah siswa</small><strong>'+db.students.length+'</strong></div><div class="stat"><small>Mata pelajaran</small><strong>'+db.subjects.length+'</strong></div><div class="stat"><small>Data nilai</small><strong>'+db.grades.length+'</strong></div></div><section class="panel"><h3>Langkah penggunaan</h3><p>1. Isi identitas madrasah pada Pengaturan.</p><p>2. Tambahkan siswa dan sesuaikan mata pelajaran serta KKM.</p><p>3. Masukkan nilai harian, UTS, UAS, kehadiran, sikap, disiplin, dan kebersihan.</p><p>4. Buka Rapor, pilih siswa, lalu cetak atau simpan sebagai PDF.</p><div class="notice">Data tersimpan pada browser/perangkat ini saja. Cadangkan data rutin. Jangan hapus data browser sebelum membuat cadangan.</div></section>'}
function students(){return '<div class="head"><h2>Daftar Peserta Didik</h2>'+btn('+ Tambah Siswa','addstu','primary')+'</div><input class="search" id="sq" placeholder="Cari nama atau NIS…" oninput="filterStu()"><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Nama / NIS</th><th>Kelas</th><th>JK</th><th>Orang tua/wali</th><th>Aksi</th></tr></thead><tbody id="sturows">'+sturows(db.students)+'</tbody></table></div>'}
function sturows(xs){return xs.length?xs.map(s=>'<tr><td><b>'+esc(s.name)+'</b><br><small>NIS: '+esc(s.nis||'-')+'</small></td><td>'+esc(s.cl||'-')+'</td><td>'+(s.gender==='P'?'Perempuan':'Laki-laki')+'</td><td>'+esc(s.parent||'-')+'</td><td>'+btn('Edit','editstu:'+s.id)+btn('Hapus','delstu:'+s.id,'danger')+'</td></tr>').join(''):'<tr><td colspan="5">Belum ada siswa.</td></tr>'}
function filterStu(){let q=v('sq').toLowerCase();$('sturows').innerHTML=sturows(db.students.filter(s=>(s.name+s.nis+s.cl).toLowerCase().includes(q)))}
function subjects(){return '<div class="head"><h2>Mata Pelajaran & KKM</h2>'+btn('+ Tambah Pelajaran','addsub','primary')+'</div><div class="tablewrap"><table><thead><tr><th>Pelajaran</th><th>Kategori</th><th>KKM</th><th>Aksi</th></tr></thead><tbody>'+(db.subjects.length?db.subjects.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.cat)+'</td><td>'+s.kkm+'</td><td>'+btn('Edit','editsub:'+s.id)+btn('Hapus','delsub:'+s.id,'danger')+'</td></tr>').join(''):'<tr><td colspan="4">Belum ada pelajaran.</td></tr>')+'</tbody></table></div><div class="notice">KKM diatur per mata pelajaran. Pastikan daftar dan KKM sesuai kebijakan madrasah.</div>'}
function grades(){let os=db.students.map(s=>[s.id,s.name+' — '+s.cl]),om=db.subjects.map(s=>[s.id,s.name+' (KKM '+s.kkm+')']);return '<div class="head"><h2>Input Nilai & Kehadiran</h2></div><section class="panel"><form id="gf"><div class="form">'+sel('Siswa','gs',os,os[0]?.[0])+sel('Mata pelajaran','gm',om,om[0]?.[0])+field('Nilai harian 0–100','gd',0,'number')+field('Nilai UTS 0–100','gu',0,'number')+field('Nilai UAS 0–100','ga',0,'number')+field('Hadir','gp',0,'number')+field('Sakit','gsi',0,'number')+field('Izin','gi',0,'number')+field('Alpa','gal',0,'number')+sel('Sikap umum','gat',ratings,'Baik')+sel('Kedisiplinan','gdi',ratings,'Baik')+sel('Kebersihan','gcl',ratings,'Baik')+'<div class="field full"><label>Catatan wali kelas</label><textarea id="gn"></textarea>'+btn('Buat catatan otomatis','autonote')+'</div></div><button class="btn primary" type="submit" '+(!os.length||!om.length?'disabled':'')+'>Simpan Nilai</button></form></section><div class="head"><h2>Nilai tersimpan</h2></div><div class="tablewrap"><table><thead><tr><th>Siswa / Pelajaran</th><th>Harian</th><th>UTS</th><th>UAS</th><th>Akhir</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+(db.grades.length?db.grades.map(g=>'<tr><td>'+esc(S(g.sid)?.name||'')+'<br><small>'+esc(M(g.mid)?.name||'')+'</small></td><td>'+g.daily+'</td><td>'+g.uts+'</td><td>'+g.uas+'</td><td>'+fmt(avg(g))+'</td><td><span class="badge '+(avg(g)>=(M(g.mid)?.kkm||75)?'':'warn')+'">'+(avg(g)>=(M(g.mid)?.kkm||75)?'Tuntas':'Belum tuntas')+'</span></td><td>'+btn('Edit','editg:'+g.id)+btn('Hapus','delg:'+g.id,'danger')+'</td></tr>').join(''):'<tr><td colspan="7">Belum ada nilai.</td></tr>')+'</tbody></table></div>'}
function report(sid){let s=S(sid);if(!s)return '<p>Tambahkan siswa terlebih dahulu.</p>';let gs=db.grades.filter(g=>g.sid===sid),last=gs[gs.length-1]||{},rows=db.subjects.map(m=>{let g=G(sid,m.id);return '<tr><td>'+esc(m.name)+'</td><td>'+(g?g.daily:'-')+'</td><td>'+(g?g.uts:'-')+'</td><td>'+(g?g.uas:'-')+'</td><td>'+(g?fmt(avg(g)):'-')+'</td><td>'+(g?(avg(g)>=m.kkm?'Tuntas':'Belum tuntas'):'-')+'</td></tr>'}).join(''),sum=k=>gs.reduce((a,g)=>a+Number(g[k]||0),0);return '<article class="report" id="paper"><h2>'+esc(db.settings.school)+'</h2><p style="text-align:center">'+esc(db.settings.address)+'</p><h3>LAPORAN HASIL BELAJAR PESERTA DIDIK</h3><p style="text-align:center">Tahun '+esc(db.settings.year)+' · Semester '+esc(db.settings.semester)+'</p><hr><p><b>Nama:</b> '+esc(s.name)+' &nbsp; <b>NIS:</b> '+esc(s.nis||'-')+'<br><b>Kelas:</b> '+esc(s.cl||'-')+'</p><h3>A. Capaian Hasil Belajar</h3><table><tr><th>Mata pelajaran</th><th>Harian</th><th>UTS</th><th>UAS</th><th>Akhir</th><th>Status</th></tr>'+rows+'</table><p><small>Bobot: harian '+db.settings.wd+'%, UTS '+db.settings.wu+'%, UAS '+db.settings.wa+'%.</small></p><h3>B. Kehadiran</h3><table><tr><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alpa</th></tr><tr><td>'+sum('present')+'</td><td>'+sum('sick')+'</td><td>'+sum('permit')+'</td><td>'+sum('absent')+'</td></tr></table><h3>C. Sikap dan Kebiasaan</h3><table><tr><th>Sikap</th><th>Kedisiplinan</th><th>Kebersihan</th></tr><tr><td>'+esc(last.attitude||'-')+'</td><td>'+esc(last.discipline||'-')+'</td><td>'+esc(last.clean||'-')+'</td></tr></table><h3>D. Catatan Wali Kelas</h3><p>'+esc(gs.map(g=>g.note).filter(Boolean)[0]||'Terus semangat belajar, menjaga disiplin dan kebersihan.')+'</p><div class="sign"><div>Orang Tua/Wali<br><br><br>(.....................)</div><div>.....................<br>Wali Kelas<br><br><br>('+esc(db.settings.teacher)+')</div></div><p><small>Format alat bantu; sesuaikan dengan ketentuan resmi madrasah.</small></p></article>'}
function reports(){let os=db.students.map(s=>[s.id,s.name+' — '+s.cl]);return '<section class="panel no-print"><h2>Rapor Peserta Didik</h2>'+sel('Pilih siswa','rs',os,os[0]?.[0])+btn('Tampilkan Rapor','showreport','primary')+btn('Cetak / Simpan PDF','print')+'</section><div id="reportarea" style="margin-top:15px">'+report(os[0]?.[0])+'</div>'}
function settings(){let s=db.settings;return '<section class="panel"><h2>Identitas & Bobot Penilaian</h2><form id="sf"><div class="form">'+field('Nama madrasah','ss',s.school)+field('Nama wali kelas','st',s.teacher)+field('Alamat','sa',s.address)+field('Tahun ajaran','sy',s.year)+sel('Semester','sm',[['Ganjil','Ganjil'],['Genap','Genap']],s.semester)+field('Bobot harian (%)','swd',s.wd,'number')+field('Bobot UTS (%)','swu',s.wu,'number')+field('Bobot UAS (%)','swa',s.wa,'number')+'</div><button class="btn primary">Simpan Pengaturan</button></form></section><section class="panel" style="margin-top:14px"><h2>Cadangan & Pemulihan</h2>'+btn('Unduh Cadangan JSON','backup','primary')+' <label class="btn" for="restore">Pulihkan Cadangan</label><input id="restore" class="hidden" type="file" accept=".json,application/json"> '+btn('Hapus Semua Data','reset','danger')+'<div class="notice">Data hanya disimpan pada browser ini. Cadangkan rutin. Data tidak otomatis tersinkron antarperangkat.</div></section>'}
function modal(title,body,cb){$('overlay').innerHTML='<div class="modalback" id="mb"><section class="modal"><h2>'+title+'</h2>'+body+'<p><button class="btn" id="cancel">Batal</button><button class="btn primary" id="ok">Simpan</button></p></section></div>';$('cancel').onclick=()=>$('overlay').innerHTML='';$('mb').onclick=e=>{if(e.target.id==='mb')$('overlay').innerHTML=''};$('ok').onclick=cb}
function addStu(s={}){modal(s.id?'Edit Siswa':'Tambah Siswa','<div class="form">'+field('Nama lengkap','mn',s.name||'')+field('NIS/NISN','mi',s.nis||'')+field('Kelas','mc',s.cl||'1')+sel('Jenis kelamin','mg',[['L','Laki-laki'],['P','Perempuan']],s.gender||'L')+field('Orang tua/wali','mp',s.parent||'')+'</div>',()=>{if(!v('mn'))return toast('Nama wajib diisi');let x={id:s.id||id(),name:v('mn'),nis:v('mi'),cl:v('mc'),gender:v('mg'),parent:v('mp')};db.students=s.id?db.students.map(a=>a.id===s.id?x:a):db.students.concat(x);save();$('overlay').innerHTML='';render();toast('Data siswa tersimpan')})}
function addSub(s={}){modal(s.id?'Edit Pelajaran':'Tambah Pelajaran','<div class="form">'+field('Nama pelajaran','mn',s.name||'')+sel('Kategori','mc',[['Umum','Umum'],['Agama','Agama'],['Muatan Lokal','Muatan Lokal']],s.cat||'Umum')+field('KKM 0–100','mk',s.kkm??75,'number')+'</div>',()=>{let k=Number(v('mk'));if(!v('mn')||k<0||k>100)return toast('Isi nama dan KKM 0–100');let x={id:s.id||id(),name:v('mn'),cat:v('mc'),kkm:k};db.subjects=s.id?db.subjects.map(a=>a.id===s.id?x:a):db.subjects.concat(x);save();$('overlay').innerHTML='';render()})}
function editg(g){modal('Edit Nilai','<div class="form">'+field('Harian','ed',g.daily,'number')+field('UTS','eu',g.uts,'number')+field('UAS','ea',g.uas,'number')+field('Hadir','ep',g.present,'number')+field('Sakit','esi',g.sick,'number')+field('Izin','ei',g.permit,'number')+field('Alpa','eal',g.absent,'number')+sel('Sikap','eat',ratings,g.attitude)+sel('Disiplin','edi',ratings,g.discipline)+sel('Kebersihan','ecl',ratings,g.clean)+'<div class="field full"><label>Catatan</label><textarea id="en">'+esc(g.note||'')+'</textarea></div></div>',()=>{for(let n of ['ed','eu','ea'])if(Number(v(n))<0||Number(v(n))>100)return toast('Nilai harus 0–100');Object.assign(g,{daily:Number(v('ed')),uts:Number(v('eu')),uas:Number(v('ea')),present:Number(v('ep')||0),sick:Number(v('esi')||0),permit:Number(v('ei')||0),absent:Number(v('eal')||0),attitude:v('eat'),discipline:v('edi'),clean:v('ecl'),note:v('en')});save();$('overlay').innerHTML='';render()})}
document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a;if(a==='addstu')addStu();else if(a.startsWith('editstu:'))addStu(S(a.split(':')[1]));else if(a.startsWith('delstu:')){let i=a.split(':')[1];if(confirm('Hapus siswa dan nilainya?')){db.students=db.students.filter(x=>x.id!==i);db.grades=db.grades.filter(x=>x.sid!==i);save();render()}}else if(a==='addsub')addSub();else if(a.startsWith('editsub:'))addSub(M(a.split(':')[1]));else if(a.startsWith('delsub:')){let i=a.split(':')[1];if(confirm('Hapus pelajaran dan nilai terkait?')){db.subjects=db.subjects.filter(x=>x.id!==i);db.grades=db.grades.filter(x=>x.mid!==i);save();render()}}else if(a==='gograde')go('grades');else if(a==='autonote'){$('gn').value=Number(v('gal'))>=5?'Perlu meningkatkan kedisiplinan kehadiran.':(Number(v('gd'))+Number(v('gu'))+Number(v('ga')))/3>=75?'Capaian belajar cukup baik. Terus tingkatkan ketekunan dan konsistensi belajar.':'Perlu latihan rutin dan pendampingan agar capaian belajar meningkat.'}else if(a.startsWith('delg:')){if(confirm('Hapus nilai?')){db.grades=db.grades.filter(x=>x.id!==a.split(':')[1]);save();render()}}else if(a.startsWith('editg:')){let g=db.grades.find(x=>x.id===a.split(':')[1]);if(g)editg(g)}else if(a==='showreport')$('reportarea').innerHTML=report(v('rs'));else if(a==='print')window.print();else if(a==='backup'){let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),x=document.createElement('a');x.href=u;x.download='cadangan-e-rapor.json';x.click();URL.revokeObjectURL(u)}else if(a==='reset'&&confirm('Hapus seluruh data?')){db=structuredClone(DEF);save();render()}});
document.addEventListener('submit',e=>{if(e.target.id==='gf'){e.preventDefault();if(!v('gs')||!v('gm'))return toast('Pilih siswa dan pelajaran');for(let n of ['gd','gu','ga'])if(v(n)===''||Number(v(n))<0||Number(v(n))>100)return toast('Nilai harus 0–100');let g={id:id(),sid:v('gs'),mid:v('gm'),daily:Number(v('gd')),uts:Number(v('gu')),uas:Number(v('ga')),present:Number(v('gp')||0),sick:Number(v('gsi')||0),permit:Number(v('gi')||0),absent:Number(v('gal')||0),attitude:v('gat'),discipline:v('gdi'),clean:v('gcl'),note:v('gn')},old=G(g.sid,g.mid);if(old){if(!confirm('Nilai ini sudah ada. Perbarui?'))return;g.id=old.id;db.grades=db.grades.map(x=>x.id===old.id?g:x)}else db.grades.push(g);save();render();toast('Nilai tersimpan')}if(e.target.id==='sf'){e.preventDefault();let w=[Number(v('swd')),Number(v('swu')),Number(v('swa'))];if(w.some(n=>n<0)||w.reduce((a,b)=>a+b,0)<=0)return toast('Bobot tidak valid');db.settings={school:v('ss'),teacher:v('st'),address:v('sa'),year:v('sy'),semester:v('sm'),wd:w[0],wu:w[1],wa:w[2]};save();render();toast('Pengaturan tersimpan')}});
document.addEventListener('change',e=>{if(e.target.id==='restore'){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.students||!x.subjects||!x.grades||!x.settings)throw 0;if(confirm('Pulihkan cadangan? Data sekarang akan diganti.')){db=Object.assign(structuredClone(DEF),x,{settings:Object.assign({},DEF.settings,x.settings)});save();render();toast('Cadangan dipulihkan')}}catch(z){toast('Berkas tidak valid')}};r.readAsText(e.target.files[0])}});render();
</script></html>
