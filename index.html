<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Rapor Madrasah | MANBAUL ULUM</title>
<style>
:root{--green:#123d32;--green2:#1d6652;--gold:#e9bb54;--bg:#f3f6f4;--card:#fff;--ink:#1b2d27;--muted:#6c7b74;--line:#dce5df;--red:#b53c3c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:var(--green2);color:#fff;font-weight:650}button.secondary{background:#e8efeb;color:var(--green)}button.danger{background:#a83333}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}label{display:block;font-weight:650;font-size:12px;color:#52635b;margin-bottom:5px}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--green);color:white;padding:22px 15px}.brand{display:flex;gap:10px;align-items:center;font-weight:850;font-size:18px;margin:0 8px 25px}.logo{display:grid;place-items:center;width:40px;height:40px;background:var(--gold);color:var(--green);border-radius:12px;font-weight:900}.brand small{display:block;font-size:11px;color:#c7ddd4;font-weight:500}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;color:#dcebe5;font-weight:600}.nav button.active,.nav button:hover{background:#ffffff1c;color:#fff}.side-note{font-size:11px;color:#c7ddd4;margin:28px 8px 0;line-height:1.6}.main{min-width:0}.top{background:white;border-bottom:1px solid var(--line);padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:15px}.top h1{font-size:20px;margin:0}.top p{margin:3px 0 0;color:var(--muted);font-size:12px}.content{padding:24px;max-width:1400px;margin:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.pagehead h2{margin:0;font-size:22px}.pagehead p{color:var(--muted);margin:4px 0 0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;margin:5px 0;color:var(--green)}.stat small{color:var(--muted)}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel h3{margin:0 0 14px;font-size:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar>*{max-width:260px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;background:#fff;min-width:620px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #edf1ee;white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#64746c;background:#f7faf8}td{font-size:13px}tr:last-child td{border-bottom:0}.actions{display:flex;gap:6px}.actions button{padding:6px 9px;font-size:11px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field.full{grid-column:1/-1}.form-actions{display:flex;gap:8px;margin-top:15px}.empty{padding:28px;text-align:center;color:var(--muted)}.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#e6f3eb;color:#1b6548;font-size:11px;font-weight:700}.notice{background:#fff8e5;border:1px solid #f1dfab;padding:12px 14px;border-radius:10px;color:#72591c;font-size:12px;margin-bottom:16px}.muted{color:var(--muted)}.money{font-variant-numeric:tabular-nums}.report{max-width:850px;margin:auto;background:white;padding:28px;border:1px solid var(--line)}.report h2,.report h3{text-align:center}.report table{min-width:0}.report td,.report th{white-space:normal}.hidden{display:none!important}.mobilemenu{display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{padding:12px 14px}.brand{margin:0 4px 10px}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.side-note{display:none}.top{padding:14px 17px}.content{padding:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.grid2{grid-template-columns:1fr}.pagehead{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.top h1{font-size:17px}}
@media print{.side,.top,.pagehead,.no-print{display:none!important}.layout{display:block}.content{padding:0}.report{border:0;padding:0;max-width:none}.report table{font-size:11px}body{background:#fff}}
</style>
</head>
<body>
<div class="layout">
<aside class="side"><div class="brand"><div class="logo">MU</div><div>MANBAUL ULUM<small>Sistem Administrasi Madrasah</small></div></div>
<nav class="nav" id="nav">
<button class="active" data-page="dashboard">▦ &nbsp; Dashboard</button><button data-page="siswa">♙ &nbsp; Data Siswa</button><button data-page="kelas">▤ &nbsp; Data Kelas</button><button data-page="rapor">✎ &nbsp; E-Rapor</button><button data-page="tabungan">◉ &nbsp; Tabungan Siswa</button><button data-page="pembayaran">▣ &nbsp; Pembayaran</button><button data-page="laporan">▧ &nbsp; Laporan</button><button data-page="pengaturan">⚙ &nbsp; Pengaturan</button>
</nav><div class="side-note">Versi web awal<br>Data disimpan di browser perangkat ini.<br>Cadangkan data secara berkala.</div></aside>
<main class="main"><header class="top"><div><h1 id="schoolTitle">E-Rapor Madrasah</h1><p id="subtitle">Kelola data akademik dan administrasi dalam satu tempat</p></div><button class="secondary" onclick="exportBackup()">⇩ Backup Data</button></header>
<div class="content" id="app"></div></main></div>
<input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="restoreBackup(event)">
<script>
const KEY='manbaul_ulum_erapor_v2';
const initial={settings:{school:'MANBAUL ULUM',address:'',year:'2026/2027',head:'',treasurer:''},students:[],classes:['TPQ 1','TPQ 2','DTA 1','DTA 2','DTA 3','DTA 4'],subjects:['Al-Qur’an Hadis','Akidah Akhlak','Fikih','Bahasa Arab','Bahasa Indonesia','Matematika','Muatan Lokal'],grades:[],savings:[],payments:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=structuredClone(initial)}
let page='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rupiah(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function el(id){return document.getElementById(id)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function head(title,desc,action=''){return '<div class="pagehead"><div><h2>'+title+'</h2><p>'+desc+'</p></div>'+action+'</div>'}
function panel(title,body){return '<section class="panel"><h3>'+title+'</h3>'+body+'</section>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows||[]).join('')+'</tbody></table></div>'}
function empty(n){return '<tr><td colspan="'+n+'" class="empty">Belum ada data. Silakan tambahkan data terlebih dahulu.</td></tr>'}
function options(arr,selected=''){return arr.map(x=>'<option '+(x===selected?'selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>').join('')}
function render(){el('schoolTitle').textContent=db.settings.school||'E-Rapor Madrasah';el('subtitle').textContent='Tahun Pelajaran '+(db.settings.year||'-')+' · Sistem administrasi madrasah';let html='';
if(page==='dashboard'){
let saldo=db.savings.reduce((s,x)=>s+(x.type==='Setoran'?+x.amount:-x.amount),0),paid=db.payments.filter(x=>x.status==='Lunas').reduce((s,x)=>s+(+x.amount||0),0);
html=head('Dashboard','Ringkasan data madrasah hari ini')+'<div class="stats"><div class="stat"><div class="label">Total Siswa</div><strong>'+db.students.length+'</strong><small>Siswa terdaftar</small></div><div class="stat"><div class="label">Jumlah Kelas</div><strong>'+db.classes.length+'</strong><small>Kelas terdaftar</small></div><div class="stat"><div class="label">Saldo Tabungan</div><strong style="font-size:21px">'+rupiah(saldo)+'</strong><small>Akumulasi transaksi</small></div><div class="stat"><div class="label">Pembayaran Lunas</div><strong style="font-size:21px">'+rupiah(paid)+'</strong><small>Total tercatat</small></div></div><div class="notice">Catatan: versi awal ini menyimpan data pada browser/perangkat yang digunakan. Data belum tersinkron otomatis antarperangkat.</div><div class="grid2">'+panel('Akses Cepat','<div class="toolbar"><button onclick="go(\'siswa\')">Kelola Siswa</button><button onclick="go(\'rapor\')">Input Nilai</button><button onclick="go(\'tabungan\')">Catat Tabungan</button><button onclick="go(\'pembayaran\')">Catat Pembayaran</button></div>')+panel('Informasi Tahun Pelajaran','<p><b>'+esc(db.settings.year)+'</b></p><p class="muted">'+esc(db.settings.school)+'</p><p class="muted">'+esc(db.settings.address||'Alamat madrasah belum diisi')+'</p>')+'</div>';
}
if(page==='siswa'){html=head('Data Siswa','Tambah dan kelola data peserta didik','<button onclick="studentForm()">+ Tambah Siswa</button>')+'<div class="panel"><div class="toolbar"><input id="searchStudent" placeholder="Cari nama / NIS..." oninput="renderStudentTable()" style="max-width:340px"><select id="filterClass" onchange="renderStudentTable()" style="max-width:220px"><option value="">Semua kelas</option>'+options(db.classes)+'</select></div><div id="studentTable"></div></div>'}
if(page==='kelas'){html=head('Data Kelas','Kelola rombongan belajar')+'<div class="grid2"><div class="panel"><h3>Tambah Kelas</h3><form onsubmit="addClass(event)"><label>Nama kelas</label><input id="newClass" required placeholder="Contoh: DTA 5"><div class="form-actions"><button>Tambah Kelas</button></div></form></div>'+panel('Daftar Kelas',table(['Nama Kelas','Jumlah Siswa','Aksi'],db.classes.map((c,i)=>'<tr><td>'+esc(c)+'</td><td>'+db.students.filter(s=>s.klass===c).length+'</td><td><button class="danger" onclick="removeClass('+i+')">Hapus</button></td></tr>')) )+'</div>'}
if(page==='rapor'){html=head('E-Rapor','Masukkan nilai dan cetak ringkasan hasil belajar')+'<div class="grid2"><div class="panel"><h3>Input Nilai</h3><form onsubmit="addGrade(event)" class="formgrid"><div class="field full"><label>Siswa</label><select id="gStudent" required>'+options(db.students.map(s=>s.nis+' · '+s.name))+'</select></div><div class="field"><label>Mata Pelajaran</label><select id="gSubject">'+options(db.subjects)+'</select></div><div class="field"><label>Semester</label><select id="gSemester"><option>Ganjil</option><option>Genap</option></select></div><div class="field"><label>Nilai Harian</label><input id="gDaily" type="number" min="0" max="100" required></div><div class="field"><label>Nilai UTS</label><input id="gUts" type="number" min="0" max="100" required></div><div class="field"><label>Nilai UAS</label><input id="gUas" type="number" min="0" max="100" required></div><div class="field"><label>KKM</label><input id="gKkm" type="number" min="0" max="100" value="75" required></div><div class="field full"><button>Simpan Nilai</button></div></form></div>'+panel('Nilai Tersimpan','<div id="gradeList"></div>')+'</div>';setTimeout(renderGrades,0)}
if(page==='tabungan'){html=head('Tabungan Siswa','Catat setoran dan penarikan tabungan')+'<div class="grid2"><div class="panel"><h3>Transaksi Baru</h3><form onsubmit="addSaving(event)" class="formgrid"><div class="field full"><label>Siswa</label><select id="svStudent" required>'+options(db.students.map(s=>s.nis+' · '+s.name))+'</select></div><div class="field"><label>Jenis Transaksi</label><select id="svType"><option>Setoran</option><option>Penarikan</option></select></div><div class="field"><label>Jumlah (Rp)</label><input id="svAmount" type="number" min="1" required></div><div class="field full"><label>Keterangan</label><input id="svNote" placeholder="Opsional"></div><div class="field full"><button>Simpan Transaksi</button></div></form></div>'+panel('Ringkasan Saldo','<div class="stat"><div class="label">Total Saldo Semua Siswa</div><strong>'+rupiah(db.savings.reduce((s,x)=>s+(x.type==='Setoran'?+x.amount:-x.amount),0))+'</strong></div>')+'</div><div class="panel" style="margin-top:16px"><h3>Riwayat Transaksi</h3>'+table(['Tanggal','Siswa','Jenis','Jumlah','Keterangan'],db.savings.slice().reverse().map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.student)+'</td><td><span class="pill">'+esc(x.type)+'</span></td><td class="money">'+rupiah(x.amount)+'</td><td>'+esc(x.note||'-')+'</td></tr>')||empty(5))+'</div>'}
if(page==='pembayaran'){html=head('Pembayaran Sekolah','Catat tagihan dan status pembayaran')+'<div class="panel"><h3>Tambah Catatan Pembayaran</h3><form onsubmit="addPayment(event)" class="formgrid"><div class="field"><label>Siswa</label><select id="pStudent" required>'+options(db.students.map(s=>s.nis+' · '+s.name))+'</select></div><div class="field"><label>Jenis Pembayaran</label><input id="pType" required placeholder="SPP, ujian, kegiatan"></div><div class="field"><label>Jumlah (Rp)</label><input id="pAmount" type="number" min="1" required></div><div class="field"><label>Status</label><select id="pStatus"><option>Lunas</option><option>Belum Lunas</option><option>Cicilan</option></select></div><div class="field full"><label>Keterangan</label><input id="pNote" placeholder="Bulan / periode / catatan"></div><div class="field full"><button>Simpan Pembayaran</button></div></form></div><div class="panel" style="margin-top:16px"><h3>Daftar Pembayaran</h3>'+table(['Tanggal','Siswa','Jenis','Jumlah','Status','Keterangan'],db.payments.slice().reverse().map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.student)+'</td><td>'+esc(x.type)+'</td><td class="money">'+rupiah(x.amount)+'</td><td><span class="pill">'+esc(x.status)+'</span></td><td>'+esc(x.note||'-')+'</td></tr>'))+'</div>'}
if(page==='laporan'){html=head('Laporan','Ringkasan data yang dapat dicetak')+'<div class="stats"><div class="stat"><div class="label">Siswa</div><strong>'+db.students.length+'</strong></div><div class="stat"><div class="label">Transaksi Tabungan</div><strong>'+db.savings.length+'</strong></div><div class="stat"><div class="label">Pembayaran</div><strong>'+db.payments.length+'</strong></div><div class="stat"><div class="label">Nilai Tersimpan</div><strong>'+db.grades.length+'</strong></div></div><div class="panel"><h3>Laporan Siswa</h3>'+table(['NIS','Nama','Kelas','L/P'],db.students.map(s=>'<tr><td>'+esc(s.nis)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.klass)+'</td><td>'+esc(s.gender)+'</td></tr>'))+'<div class="form-actions no-print"><button onclick="window.print()">Cetak / Simpan PDF</button><button class="secondary" onclick="exportBackup()">Unduh Backup JSON</button><button class="secondary" onclick="el(\'restoreFile\').click()">Pulihkan Backup</button></div></div>'}
if(page==='pengaturan'){html=head('Pengaturan','Identitas madrasah dan data cadangan')+'<div class="panel"><form onsubmit="saveSettings(event)" class="formgrid"><div class="field"><label>Nama Madrasah</label><input id="setSchool" required value="'+esc(db.settings.school)+'"></div><div class="field"><label>Tahun Pelajaran</label><input id="setYear" value="'+esc(db.settings.year)+'"></div><div class="field full"><label>Alamat</label><textarea id="setAddress">'+esc(db.settings.address)+'</textarea></div><div class="field"><label>Kepala Madrasah</label><input id="setHead" value="'+esc(db.settings.head)+'"></div><div class="field"><label>Bendahara</label><input id="setTreasurer" value="'+esc(db.settings.treasurer)+'"></div><div class="field full"><button>Simpan Pengaturan</button></div></form></div><div class="panel" style="margin-top:16px"><h3>Cadangan dan Pemulihan</h3><p class="muted">Simpan cadangan sebelum mengganti perangkat atau membersihkan data browser.</p><div class="toolbar"><button onclick="exportBackup()">Unduh Backup</button><button class="secondary" onclick="el(\'restoreFile\').click()">Pulihkan Backup</button><button class="danger" onclick="clearAll()">Hapus Semua Data</button></div></div>'}
el('app').innerHTML=html;
if(page==='siswa')renderStudentTable();
}
function studentForm(index=-1){let s=index>=0?db.students[index]:{nis:'',name:'',klass:db.classes[0]||'',gender:'L',birth:'',parent:'',phone:''};el('app').innerHTML=head(index>=0?'Ubah Data Siswa':'Tambah Siswa','Lengkapi data peserta didik')+'<div class="panel"><form onsubmit="saveStudent(event,'+index+')" class="formgrid"><div class="field"><label>NIS / NIS Lokal</label><input id="sNis" required value="'+esc(s.nis)+'"></div><div class="field"><label>Nama Lengkap</label><input id="sName" required value="'+esc(s.name)+'"></div><div class="field"><label>Kelas</label><select id="sClass" required>'+options(db.classes,s.klass)+'</select></div><div class="field"><label>Jenis Kelamin</label><select id="sGender"><option '+(s.gender==='L'?'selected':'')+' value="L">Laki-laki</option><option '+(s.gender==='P'?'selected':'')+' value="P">Perempuan</option></select></div><div class="field"><label>Tanggal Lahir</label><input id="sBirth" type="date" value="'+esc(s.birth)+'"></div><div class="field"><label>Nama Orang Tua/Wali</label><input id="sParent" value="'+esc(s.parent)+'"></div><div class="field full"><label>No. HP Orang Tua/Wali</label><input id="sPhone" value="'+esc(s.phone)+'"></div><div class="field full form-actions"><button>Simpan Siswa</button><button type="button" class="secondary" onclick="go(\'siswa\')">Batal</button></div></form></div>'}
function saveStudent(e,i){e.preventDefault();let s={nis:el('sNis').value.trim(),name:el('sName').value.trim(),klass:el('sClass').value,gender:el('sGender').value,birth:el('sBirth').value,parent:el('sParent').value,phone:el('sPhone').value};if(db.students.some((x,j)=>x.nis===s.nis&&j!==i)){alert('NIS sudah digunakan.');return}if(i>=0)db.students[i]=s;else db.students.push(s);save();go('siswa')}
function renderStudentTable(){let q=(el('searchStudent')?.value||'').toLowerCase(),c=el('filterClass')?.value||'';let rows=db.students.filter(s=>(!c||s.klass===c)&&[s.nis,s.name,s.klass].some(v=>String(v).toLowerCase().includes(q))).map(s=>{let i=db.students.indexOf(s);return '<tr><td>'+esc(s.nis)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.klass)+'</td><td>'+esc(s.gender==='L'?'Laki-laki':'Perempuan')+'</td><td><div class="actions"><button onclick="studentForm('+i+')">Edit</button><button class="danger" onclick="deleteStudent('+i+')">Hapus</button></div></td></tr>'});el('studentTable').innerHTML=table(['NIS','Nama Siswa','Kelas','Jenis Kelamin','Aksi'],rows.length?rows:[empty(5)])}
function deleteStudent(i){if(confirm('Hapus data siswa ini? Riwayat transaksi lama tetap tersimpan.')){db.students.splice(i,1);save()}}
function addClass(e){e.preventDefault();let v=el('newClass').value.trim();if(db.classes.includes(v)){alert('Kelas sudah ada');return}db.classes.push(v);save()}
function removeClass(i){let c=db.classes[i];if(db.students.some(s=>s.klass===c)){alert('Kelas masih memiliki siswa. Pindahkan siswa terlebih dahulu.');return}if(confirm('Hapus kelas '+c+'?')){db.classes.splice(i,1);save()}}
function addGrade(e){e.preventDefault();if(!db.students.length){alert('Tambahkan data siswa terlebih dahulu.');return}let st=el('gStudent').value;let [nis,...rest]=st.split(' · ');let g={nis,student:rest.join(' · '),subject:el('gSubject').value,semester:el('gSemester').value,daily:+el('gDaily').value,uts:+el('gUts').value,uas:+el('gUas').value,kkm:+el('gKkm').value};g.final=Math.round(g.daily*.4+g.uts*.3+g.uas*.3);db.grades.push(g);save()}
function renderGrades(){let box=el('gradeList');if(!box)return;box.innerHTML=table(['Siswa','Mapel','Semester','Akhir','Status'],db.grades.slice().reverse().map(g=>'<tr><td>'+esc(g.student)+'</td><td>'+esc(g.subject)+'</td><td>'+esc(g.semester)+'</td><td>'+g.final+'</td><td><span class="pill" style="'+(g.final<g.kkm?'background:#fae6e6;color:#a22':'')+'">'+(g.final>=g.kkm?'Tuntas':'Belum Tuntas')+'</span></td></tr>'))}
function addSaving(e){e.preventDefault();let [nis,...rest]=el('svStudent').value.split(' · '),type=el('svType').value,amount=+el('svAmount').value;let balance=db.savings.filter(x=>x.nis===nis).reduce((a,x)=>a+(x.type==='Setoran'?+x.amount:-x.amount),0);if(type==='Penarikan'&&amount>balance){alert('Saldo siswa tidak mencukupi. Saldo saat ini '+rupiah(balance));return}db.savings.push({date:new Date().toLocaleDateString('id-ID'),nis,student:rest.join(' · '),type,amount,note:el('svNote').value});save()}
function addPayment(e){e.preventDefault();let [nis,...rest]=el('pStudent').value.split(' · ');db.payments.push({date:new Date().toLocaleDateString('id-ID'),nis,student:rest.join(' · '),type:el('pType').value,amount:+el('pAmount').value,status:el('pStatus').value,note:el('pNote').value});save()}
function saveSettings(e){e.preventDefault();db.settings={school:el('setSchool').value,year:el('setYear').value,address:el('setAddress').value,head:el('setHead').value,treasurer:el('setTreasurer').value};save();alert('Pengaturan disimpan.')}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-manbaul-ulum-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.students||!x.settings)throw Error();if(confirm('Pulihkan backup? Data saat ini akan diganti.')){db=x;save();alert('Backup berhasil dipulihkan.')}}catch(err){alert('File backup tidak valid.')}e.target.value=''};r.readAsText(f)}
